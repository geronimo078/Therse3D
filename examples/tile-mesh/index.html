<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>therse3d — Tile-Mesh Engine Plugin</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070d19;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      #canvas { width: 100%; height: 100%; display: block; }
      #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        width: 350px;
        max-height: calc(100vh - 28px);
        overflow-y: auto;
        padding: 14px 16px;
        background: rgba(10, 16, 30, 0.88);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 12px;
        font-size: 12.5px;
      }
      h1 { margin: 0 0 4px; font-size: 16px; color: #38bdf8; }
      .sub { margin: 0 0 10px; font-size: 11.5px; color: #94a3b8; line-height: 1.4; }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-bottom: 10px;
      }
      .stat {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 8px;
        padding: 6px 8px;
      }
      .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
      .stat-val { font-size: 14px; font-weight: 700; color: #f8fafc; margin-top: 2px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      button {
        cursor: pointer;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: rgba(30, 41, 59, 0.92);
        color: #f8fafc;
        padding: 6px 10px;
        border-radius: 7px;
        font-size: 12px;
      }
      button:hover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.16); }
      button.active {
        border-color: #38bdf8;
        background: rgba(14, 116, 144, 0.5);
        color: #e0f2fe;
      }
      pre {
        margin: 8px 0 0;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(2, 6, 23, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.16);
        font-size: 11px;
        line-height: 1.4;
        max-height: 185px;
        overflow: auto;
        white-space: pre-wrap;
        color: #a5f3fc;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <aside id="hud">
      <h1>Tile-Mesh Engine Plugin</h1>
      <p class="sub">
        Georeferenced spherical &amp; planar terrain tiles, camera-distance LOD, seamless cross-border normals &amp; skirts, and deterministic GPU buffer lifecycle.
      </p>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Tiles</div>
          <div class="stat-val" id="statTiles">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Vertices</div>
          <div class="stat-val" id="statVerts">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Triangles</div>
          <div class="stat-val" id="statTris">0</div>
        </div>
      </div>

      <div class="row">
        <button id="btnSpherical" class="active">Spherical Planet</button>
        <button id="btnPlanar">Planar Terrain</button>
      </div>
      <div class="row">
        <button id="btnReplaceTile">Replace Selected</button>
        <button id="btnRemoveTile">Remove Selected</button>
        <button id="btnAsyncTile">Async Stream Tile</button>
        <button id="btnSkirts" class="active">Skirts: ON</button>
      </div>
      <div class="row">
        <button id="btnBrushMode">Click: Inspect</button>
      </div>

      <pre id="output">Initializing Tile-Mesh Plugin...</pre>
    </aside>

    <script type="module" src="./tile-demo.js"></script>
  </body>
</html>

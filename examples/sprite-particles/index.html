<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>therse3d — Sprite Particle Plugin Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f19;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      #canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .hud {
        position: fixed;
        top: 14px;
        left: 14px;
        width: 280px;
        background: rgba(15, 23, 42, 0.84);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
        padding: 14px;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .hud h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        color: #f8fafc;
      }
      .hud p {
        margin: 0;
        color: #94a3b8;
        font-size: 12px;
        line-height: 1.4;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      button {
        appearance: none;
        border: 1px solid rgba(148, 163, 184, 0.28);
        background: rgba(30, 41, 59, 0.9);
        color: #e2e8f0;
        border-radius: 8px;
        padding: 7px 9px;
        font-size: 12px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      button:hover {
        background: rgba(51, 65, 85, 0.95);
      }
      button.active {
        background: rgba(37, 99, 235, 0.35);
        border-color: #60a5fa;
        color: #ffffff;
      }
      button.burst {
        grid-column: 1 / -1;
        background: rgba(234, 88, 12, 0.28);
        border-color: rgba(251, 146, 60, 0.65);
      }
      .stats {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        color: #cbd5e1;
        background: rgba(2, 6, 23, 0.55);
        border-radius: 8px;
        padding: 8px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div class="hud">
      <h1>Sprite Particle Plugin</h1>
      <p>Optionales Partikel-Plugin für Feuer, Rauch, Magie, Regen, Schnee, Funken und Explosionen.</p>
      <div class="grid">
        <button id="btn-fire" class="active">Fire + Smoke</button>
        <button id="btn-magic" class="active">Magic Spell</button>
        <button id="btn-sparks" class="active">Sparks</button>
        <button id="btn-rain">Rain</button>
        <button id="btn-snow">Snow</button>
        <button id="btn-pause">Pause</button>
        <button id="btn-burst" class="burst">Trigger Explosion Burst</button>
      </div>
      <div id="stats" class="stats">Initializing WebGPU…</div>
    </div>

    <script type="module">
      import {
        Engine,
        OrbitControls,
        Plane,
        Cylinder,
        Torus,
        Light,
        SpriteParticlePlugin,
      } from '../../src/index.ts';

      const app = await Engine.create('#canvas', {
        preset: 'studio',
        bloom: { enabled: true, threshold: 0.9, strength: 0.55 },
      });

      app.use(OrbitControls({ distance: 9, polar: 1.15, azimuth: 0.6, target: [0, 1.0, 0] }));

      // Ground + three pedestals for Fire, Magic, and Sparks
      app.add(Plane({ id: 'ground', scale: [14, 1, 14], material: 'studio-grid', color: '#1e293b' }));
      app.add(Cylinder({ id: 'fire-pit', position: [-2.4, 0.12, 0], scale: [1.1, 0.24, 1.1], color: '#334155', roughness: 0.85 }));
      app.add(Torus({ id: 'magic-ring', position: [0, 0.08, 0], scale: [1.3, 0.25, 1.3], color: '#38bdf8', emissive: 0.6 }));
      app.add(Cylinder({ id: 'anvil', position: [2.4, 0.22, 0], scale: [0.85, 0.44, 0.85], color: '#475569', metalness: 0.65, roughness: 0.35 }));

      // Warm campfire point light + cool arcane light
      app.add(Light({ id: 'sun', kind: 'directional', position: [6, 10, 5], color: '#cbd5e1', intensity: 1.2 }));
      app.add(Light({ id: 'fire-light', kind: 'point', position: [-2.4, 1.1, 0], color: '#fb923c', intensity: 3.4 }));
      app.add(Light({ id: 'magic-light', kind: 'point', position: [0, 1.2, 0], color: '#38bdf8', intensity: 2.8 }));

      // Optional Sprite Particle Plugin
      const particles = SpriteParticlePlugin(app, { maxParticles: 520 });

      const fire = particles.createEmitter({ id: 'fire', preset: 'fire', position: [-2.4, 0.28, 0] });
      const smoke = particles.createEmitter({ id: 'smoke', preset: 'smoke', position: [-2.4, 1.05, 0] });
      const magic = particles.createEmitter({ id: 'magic', preset: 'magic', position: [0, 0.18, 0] });
      const sparks = particles.createEmitter({ id: 'sparks', preset: 'sparks', position: [2.4, 0.48, 0] });
      const rain = particles.createEmitter({ id: 'rain', preset: 'rain', position: [0, 6.2, 0], enabled: false });
      const snow = particles.createEmitter({ id: 'snow', preset: 'snow', position: [0, 6.2, 0], enabled: false });

      const statsEl = document.getElementById('stats');
      let paused = false;

      const bindToggle = (id, onToggle) => {
        const btn = document.getElementById(id);
        btn.addEventListener('click', () => {
          const active = !btn.classList.contains('active');
          btn.classList.toggle('active', active);
          onToggle(active, btn);
        });
      };

      bindToggle('btn-fire', (on) => {
        fire.setEnabled(on);
        smoke.setEnabled(on);
      });
      bindToggle('btn-magic', (on) => magic.setEnabled(on));
      bindToggle('btn-sparks', (on) => sparks.setEnabled(on));
      bindToggle('btn-rain', (on) => rain.setEnabled(on));
      bindToggle('btn-snow', (on) => snow.setEnabled(on));
      bindToggle('btn-pause', (on, btn) => {
        paused = on;
        btn.textContent = paused ? 'Resume' : 'Pause';
        if (paused) particles.pause();
        else particles.resume();
      });

      document.getElementById('btn-burst').addEventListener('click', () => {
        particles.burst({ preset: 'explosion', position: [0, 1.4, 0] }, 64);
      });

      app.onTick(() => {
        const s = particles.getStats();
        statsEl.textContent =
          `Active: ${s.activeParticles} / ${s.maxParticles}\n` +
          `Pooled Sprites: ${s.pooledParticles}\n` +
          `Emitters: ${s.emitterCount} | State: ${s.paused ? 'Paused' : 'Running'}`;
      });
    </script>
  </body>
</html>
